name: Update Cambridge thresholds

# Click "Run workflow" on the Actions tab to run it now.
# It also runs by itself on the 1st and 15th of every month, which catches each new results release.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1,15 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF reader
        run: pip install pypdf pdfplumber

      - name: Read Cambridge threshold tables
        run: python scripts/update_thresholds.py

      - name: Save new data to the repo
        run: |
          git config user.name "prepflow-bot"
          git config user.email "prepflow-bot@users.noreply.github.com"
          git add src/data/thresholds.generated.json
          if git diff --staged --quiet; then
            echo "No new thresholds."
          else
            git commit -m "Update Cambridge grade thresholds"
            git push
          fi
